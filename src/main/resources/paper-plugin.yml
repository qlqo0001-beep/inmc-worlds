name: inmc-worlds
version: '${version}'
main: com.inmc.worlds.WorldsPlugin
api-version: '${apiVersion}'   # build.gradle.kts 의 inmc { paper } 에서 유도됨
description: INMC 월드·모드 - 월드 만들기·설정을 인게임 화면으로, 서버를 모드(월드 묶음)로 나눠 모드마다 다른 서버처럼 (Multiverse 3종 대체)
authors: [ INMC ]

# 월드를 불러오는 플러그인이라 월드를 읽는 플러그인들보다 먼저 켜진다 — `load: AFTER` = 그 플러그인이 우리 뒤에 켜진다.
# 반대 방향(BEFORE)은 걸지 않는다: Paper 가 순환을 보고 간선을 조용히 끊는다(가이드 함정 1).
dependencies:
  server:
    inmc-core:        { load: BEFORE, required: true,  join-classpath: true }
    PlaceholderAPI:   { load: OMIT,   required: false, join-classpath: true }
    inmc-essentials:  { load: AFTER,  required: false }
    inmc-dungeon:     { load: AFTER,  required: false }
    inmc-menu:        { load: AFTER,  required: false }
    inmc-customitems: { load: AFTER,  required: false }
    Citizens:         { load: AFTER,  required: false }
    Shopkeepers:      { load: AFTER,  required: false }
    Images:           { load: AFTER,  required: false }

# commands 절은 paper-plugin.yml 에 없다 - Brigadier 로 등록한다.

permissions:
  inmcworlds.admin:
    description: 월드·모드 관리 전체 (만들기·불러오기·지우기·설정·게임 규칙·포탈 연결·모드·기능 토글·검증)
    default: op
  inmcworlds.bypass.travel:
    description: 모드가 다른 곳으로 아무 이동(TPA·워프·/tp)으로나 갈 수 있다 — 넘으면 몸이 바뀐다
    default: op
# 모드마다 inmcworlds.mode.<id> — 선언하지 않는다(기본 허용). 막으려면 LuckPerms 에서 false 로.
